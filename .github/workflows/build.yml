name: Build & Alpha release / 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Bilingual documentation / 双语文档
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Check language sections and local links / 检查双语分区与本地链接
        run: python scripts/check_docs.py

  windows:
    name: Windows host / 电脑端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Test and build
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python (Get-Command python).Source
      - name: Package host with notices and guide
        shell: pwsh
        run: python scripts/package_release.py --windows-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VRization-Windows
          path: artifacts/release/VRization-Windows-x64.zip
          if-no-files-found: error

  android:
    name: Android APK and reusable AAR / 手机端与核心库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :vr-core:testDebugUnitTest :app:testDebugUnitTest :vr-core:assembleDebug :app:assembleDebug :app:lintDebug
      - name: Package testing APK, core and licenses
        run: python3 scripts/package_release.py --android-only --core-variant debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VRization-Android
          path: |
            artifacts/release/VRization-Android-debug.apk
            artifacts/release/VRization-vr-core-alpha.aar
            artifacts/release/VRization-Licenses.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Android-check-reports
          path: |
            android/app/build/reports/lint-results-debug.html
            android/vr-core/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  ios:
    name: iOS client and reusable Swift core / 苹果客户端与核心库
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.10'
      - name: Install synthetic stream fixture / 安装合成串流测试环境
        run: |
          python3 -m pip install aiohttp==3.14.4 pillow==12.3.0
          python3 -m pip install --no-deps -e ./desktop
      - name: Test core, build both SDKs and exercise iPhone UI / 测试核心、双 SDK 构建和手机界面
        run: python3 scripts/build_ios.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VRization-iOS
          path: |
            artifacts/release/VRization-iOS-source.zip
            artifacts/release/VRization-iOS-Simulator.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: iOS-check-reports
          path: |
            artifacts/ios/UI.xcresult/
            artifacts/ios/screenshots/
            artifacts/ios/environment.json
            artifacts/ios/host-report.json
          if-no-files-found: ignore

  release:
    name: Publish tagged Alpha prerelease / 发布 Alpha 预览版
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [documentation, windows, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: VRization-*
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Publish new prerelease without replacing existing binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Keeping its verified binaries and signing identity; new builds remain available as workflow artifacts.'
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "VRization $RELEASE_TAG · Alpha / 预览版" --notes-file docs/RELEASE_NOTES.md
          fi
